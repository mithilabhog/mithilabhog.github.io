<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mithila Bhog | Website opening soon</title>
<meta name="description" content="Mithila Bhog: pickles with the taste of Mithilanchal. Our website opens soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --turmeric: #E2A82E;
    --brown: #2B1A10;
    --rust: #9C3F1B;
    --paper: #FFFFFF;
    --brass: #B8912F;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--turmeric);
    color: var(--brown);
    font-family: 'Hind', system-ui, sans-serif;
    font-size: 1.125rem;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
  }
  .band {
    height: 14px;
    flex: none;
    background:
      repeating-linear-gradient(90deg, var(--brown) 0 12px, transparent 12px 20px),
      var(--turmeric);
  }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: clamp(2rem, 6vw, 6rem);
    align-items: center;
    width: min(1100px, 100%);
    margin: 0 auto;
    padding: clamp(1.5rem, 5vw, 4rem) clamp(1.25rem, 5vw, 3rem);
  }
  h1 {
    font-family: 'Rozha One', Georgia, serif;
    font-weight: 400;
    font-size: clamp(3rem, 8vw, 6rem);
    line-height: 1;
    margin: 0 0 1.25rem;
    color: var(--brown);
  }
  .lead {
    font-size: clamp(1.25rem, 2.4vw, 1.6rem);
    max-width: 24ch;
    margin: 0 0 2rem;
  }
  .notice {
    display: inline-block;
    background: var(--brown);
    color: #FFF3D6;
    padding: 0.9rem 1.5rem;
    border-radius: 999px;
    font-weight: 500;
  }
  .notice span { color: var(--turmeric); }
  .frame {
    justify-self: center;
    width: min(100%, 380px);
    aspect-ratio: 4 / 5;
    background: var(--paper);
    border: 8px solid var(--brown);
    border-radius: 190px 190px 14px 14px;
    outline: 3px solid var(--rust);
    outline-offset: 7px;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 55%;
    display: block;
  }
  footer {
    flex: none;
    text-align: center;
    padding: 0.75rem 1rem 1rem;
    font-size: 0.9rem;
  }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; text-align: center; }
    .lead { margin-left: auto; margin-right: auto; }
    .frame { order: -1; width: min(78%, 320px); }
  }
</style>
</head>
<body>
  <div class="band" aria-hidden="true"></div>

  <main>
    <section>
      <h1>Mithila Bhog</h1>
      <p class="lead">Pickles with the taste of Mithilanchal.</p>
      <p class="notice">Our website is getting ready. <span>Please visit again soon.</span></p>
      <!--
        LATER: add your contact here, for example:
        <p><a href="https://wa.me/91XXXXXXXXXX">Order on WhatsApp</a></p>
        <p><a href="https://instagram.com/your_handle">Instagram</a></p>
      -->
    </section>

    <div class="frame">
      <img src="jar.png" alt="A jar of Mithila Bhog pickle on a wooden board with a wooden spoon">
    </div>
  </main>

  <footer>&copy; 2026 Mithila Bhog</footer>
  <div class="band" aria-hidden="true"></div>
</body>
</html>
